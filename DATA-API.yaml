config_version: "1.0"
solution: { name: "MAX ДВИЖ", team: "TBD", stage: "MVP" }
base_url: "http://localhost:8000"
authentication:
  production: "X-MAX-Init-Data with validated MAX WebApp.initData"
  local_demo: "X-Demo-User is accepted only when APP_ENV=development"
checks:
  - id: session
    method: GET
    path: /api/v1/session
    role: authenticated_user
    headers: { X-Demo-User: anton }
    expected_statuses: [200]
    required_response_fields: [id, display_name]
  - id: create_group
    method: POST
    path: /api/v1/groups
    role: authenticated_user
    headers: { X-Demo-User: anton }
    body: { name: "Тестовая компания", city_slug: "ekb" }
    expected_statuses: [201]
    required_response_fields: [id, name, invite_token]
  - id: create_location
    method: POST
    path: /api/v1/locations
    role: authenticated_user
    headers: { X-Demo-User: anton }
    body: "Use label and real coordinates returned by device geolocation; city_slug must match a Company joined by this user."
    expected_statuses: [201]
    required_response_fields: [id, label, city_slug, address_text, is_default]
  - id: rename_location
    method: PATCH
    path: /api/v1/locations/{location_id}
    role: location_owner
    headers: { X-Demo-User: anton }
    body: { label: "Дом" }
    expected_statuses: [200, 404]
    required_response_fields: [id, label, is_default]
  - id: default_location
    method: POST
    path: /api/v1/locations/{location_id}/default
    role: location_owner
    headers: { X-Demo-User: anton }
    expected_statuses: [200, 404]
    required_response_fields: [id, is_default]
  - id: delete_location
    method: DELETE
    path: /api/v1/locations/{location_id}
    role: location_owner
    headers: { X-Demo-User: anton }
    expected_statuses: [200, 404, 409]
    required_response_fields: [status]
  - id: create_signal
    method: POST
    path: /api/v1/signal-batches
    role: group_member
    headers: { X-Demo-User: anton }
    body: "Use group_ids from groups (same city), activity_categories, future available_from/available_to, min_people >= 2; budget/radius/location/max_people may be null."
    expected_statuses: [201, 422]
    required_response_fields: [signal_batch_id, intents]
  - id: active_signals
    method: GET
    path: /api/v1/intents
    role: authenticated_user
    headers: { X-Demo-User: anton }
    expected_statuses: [200]
    required_response_fields: []
  - id: retry_signal_search
    method: POST
    path: /api/v1/signal-batches/{batch_id}/refresh
    role: signal_owner
    headers: { X-Demo-User: anton }
    expected_statuses: [200, 404]
    required_response_fields: [signal_batch_id, intents]
  - id: offers
    method: GET
    path: /api/v1/offers
    role: authenticated_user
    headers: { X-Demo-User: anton }
    expected_statuses: [200]
    required_response_fields: []
  - id: accept_exact_offer
    method: POST
    path: /api/v1/offers/{offer_id}/accept
    role: offer_owner
    headers: { X-Demo-User: anton }
    body: { confirm_near_exception: false }
    expected_statuses: [200, 409]
    required_response_fields: [id, status]
  - id: accept_near_offer
    method: POST
    path: /api/v1/offers/{offer_id}/accept
    role: offer_owner
    headers: { X-Demo-User: anton }
    body: { confirm_near_exception: true }
    expected_statuses: [200, 409]
    required_response_fields: [id, status]
  - id: confirmed_plans
    method: GET
    path: /api/v1/plans
    role: participant
    headers: { X-Demo-User: anton }
    expected_statuses: [200]
    required_response_fields: []
  - id: cancel_participation
    method: POST
    path: /api/v1/offers/{offer_id}/cancel
    role: offer_owner
    headers: { X-Demo-User: anton }
    expected_statuses: [200, 409]
    required_response_fields: [id, status]
