services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-max_dvizh}
      POSTGRES_USER: ${POSTGRES_USER:-max_dvizh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-max_dvizh}:${POSTGRES_PASSWORD:-local_development_only}@postgres:5432/${POSTGRES_DB:-max_dvizh}
      REDIS_URL: redis://redis:6379/0
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_API_BASE: ${MAX_BOT_API_BASE:-https://platform-api2.max.ru}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      MAX_MINI_APP_URL: ${MAX_MINI_APP_URL:-}
      KUDAGO_BASE_URL: ${KUDAGO_BASE_URL:-https://kudago.com/public-api/v1.4}
      KUDAGO_TIMEOUT_SECONDS: ${KUDAGO_TIMEOUT_SECONDS:-5}
      NEAR_BUDGET_MAX_DELTA_RUB: ${NEAR_BUDGET_MAX_DELTA_RUB:-150}
      LEISURE_CACHE_TTL_SECONDS: ${LEISURE_CACHE_TTL_SECONDS:-900}
      KUDAGO_MAX_PAGES: ${KUDAGO_MAX_PAGES:-3}
      PLACE_PLAN_DURATION_MINUTES: ${PLACE_PLAN_DURATION_MINUTES:-120}
      MAX_INIT_DATA_MAX_AGE_SECONDS: ${MAX_INIT_DATA_MAX_AGE_SECONDS:-3600}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-5}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.modules.max_integration.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-max_dvizh}:${POSTGRES_PASSWORD:-local_development_only}@postgres:5432/${POSTGRES_DB:-max_dvizh}
      REDIS_URL: redis://redis:6379/0
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_API_BASE: ${MAX_BOT_API_BASE:-https://platform-api2.max.ru}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      MAX_MINI_APP_URL: ${MAX_MINI_APP_URL:-}
      KUDAGO_BASE_URL: ${KUDAGO_BASE_URL:-https://kudago.com/public-api/v1.4}
      KUDAGO_TIMEOUT_SECONDS: ${KUDAGO_TIMEOUT_SECONDS:-5}
      NEAR_BUDGET_MAX_DELTA_RUB: ${NEAR_BUDGET_MAX_DELTA_RUB:-150}
      LEISURE_CACHE_TTL_SECONDS: ${LEISURE_CACHE_TTL_SECONDS:-900}
      KUDAGO_MAX_PAGES: ${KUDAGO_MAX_PAGES:-3}
      PLACE_PLAN_DURATION_MINUTES: ${PLACE_PLAN_DURATION_MINUTES:-120}
      MAX_INIT_DATA_MAX_AGE_SECONDS: ${MAX_INIT_DATA_MAX_AGE_SECONDS:-3600}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-5}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "app.modules.matching.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-max_dvizh}:${POSTGRES_PASSWORD:-local_development_only}@postgres:5432/${POSTGRES_DB:-max_dvizh}
      REDIS_URL: redis://redis:6379/0
      KUDAGO_BASE_URL: ${KUDAGO_BASE_URL:-https://kudago.com/public-api/v1.4}
      KUDAGO_TIMEOUT_SECONDS: ${KUDAGO_TIMEOUT_SECONDS:-5}
      KUDAGO_MAX_PAGES: ${KUDAGO_MAX_PAGES:-3}
      PLACE_PLAN_DURATION_MINUTES: ${PLACE_PLAN_DURATION_MINUTES:-120}
      LEISURE_CACHE_TTL_SECONDS: ${LEISURE_CACHE_TTL_SECONDS:-900}
      NEAR_BUDGET_MAX_DELTA_RUB: ${NEAR_BUDGET_MAX_DELTA_RUB:-150}
      AUTOSIGNAL_POLL_SECONDS: ${AUTOSIGNAL_POLL_SECONDS:-1800}
      AUTOSIGNAL_LOOKAHEAD_DAYS: ${AUTOSIGNAL_LOOKAHEAD_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

volumes:
  postgres-data:
