name: checks

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://max_dvizh:test_only_password@localhost:5432/max_dvizh
      TEST_DATABASE_URL: postgresql+psycopg://max_dvizh:test_only_password@localhost:5432/max_dvizh
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: max_dvizh
          POSTGRES_USER: max_dvizh
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U max_dvizh -d max_dvizh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.lock
      - name: Upgrade a populated pre-rework database
        run: |
          alembic upgrade 20260916_0005
          python scripts/verify_migration_paths.py seed-legacy
          alembic upgrade head
          python scripts/verify_migration_paths.py verify-upgrade
      - name: Upgrade a clean PostgreSQL database
        run: |
          python scripts/verify_migration_paths.py create-clean-database
          alembic upgrade head
          test "$(alembic current | tail -n 1 | awk '{print $1}')" = "20260925_0012"
        env:
          DATABASE_URL: postgresql+psycopg://max_dvizh:test_only_password@localhost:5432/max_dvizh_clean
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app scripts
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Start the full stack
        run: docker compose up -d --no-build
      - name: Smoke API and Mini App
        run: |
          for attempt in {1..45}; do
            if curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null && curl -fsS http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=80
          exit 1
      - name: Stop the full stack
        if: always()
        run: docker compose down -v
